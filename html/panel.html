<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebInsight Panel</title>
    <link rel="stylesheet" href="../css/panel.css">
</head>
<body>
    <div class="panel-container">
        <header class="panel-header">
            <h1>JCz WebInsight</h1>
            <div class="panel-actions">
                <button id="panelSavePageBtn" title="Save visible text and basic info from the current page">Save Page</button>
                <button id="panelSavePageAsPDFBtn" title="Save the entire webpage as a PDF document">Save as PDF</button>
                <button id="panelSaveSelectionBtn" title="Save the currently selected text on the page">Save Selection</button>
                <button id="panelCaptureVisibleBtn" title="Capture a screenshot of the currently visible area">Capture Visible</button>
                <button id="panelCaptureAreaBtn" title="Select a specific area on the page to capture">Capture Area</button>
            </div>
        </header>

        <div id="panelStatusMessage" class="status-message" aria-live="polite"></div>

        <main class="panel-content">

            <section class="panel-filter-section">
                <h3>Filter by Tag</h3>
                <div id="tagFilterList" class="tag-filter-list">
                    <i>Loading tags...</i>
                </div>
                <div class="filter-actions">
                    <button id="clearTagFilterBtn" class="clear-filter-btn" style="display: none;">Show All Items</button>
                    <button id="getKeyPointsBtn" class="key-points-btn" style="display: none;" title="Generate key points from items with the selected tag">Get Key Points</button>
                    <button id="generateReportBtn" class="generate-report-btn" style="display: none;" title="Generate a comprehensive PDF report from items with the selected tag">Generate Report</button>
                    <!-- New Project Export Button -->
                    <button id="exportProjectBtn" class="export-project-btn" style="display: none;" title="Export all items with this tag into a single JSON file for AI analysis">Export Project for AI</button>
                </div>
            </section>

            <!-- Chat accordion -->
            <details id="chatAccordion" class="panel-accordion">
                <summary class="panel-accordion-summary">
                    <span>Chat with your Research</span>
                    <span class="panel-accordion-hint">Scoped to: all items</span>
                </summary>
                <div class="panel-accordion-body chat-panel">
                    <div class="chat-toolbar">
                        <button id="chatSaveBtn" class="chat-tool-btn" title="Save conversation to saved items" disabled>
                            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M13 14H3a1 1 0 01-1-1V3a1 1 0 011-1h8l3 3v8a1 1 0 01-1 1z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                                <rect x="5" y="9" width="6" height="5" rx="0.5" stroke="currentColor" stroke-width="1.4"/>
                                <rect x="5" y="2" width="5" height="3" rx="0.5" stroke="currentColor" stroke-width="1.4"/>
                            </svg>
                        </button>
                        <button id="chatNewBtn" class="chat-tool-btn" title="Start a new conversation">
                            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                            </svg>
                        </button>
                    </div>
                    <div id="chatHistory" class="chat-history" aria-live="polite"></div>
                    <div class="chat-input-row">
                        <textarea id="chatInput" class="chat-input" rows="2" placeholder="Ask something about your saved items…"></textarea>
                        <button id="chatSendBtn" class="chat-send-btn" title="Send">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M14 8L2 2l2.5 6L2 14l12-6z" fill="currentColor"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </details>
            
            <h2>Saved Items</h2>
            <div id="keyPointsResultDisplay" class="key-points-result-area">
            </div>
            <div id="panelContentList" class="content-list-container">
                <p><i>Loading saved items...</i></p>
            </div>

        </main>

        <footer class="panel-footer">
            <button id="panelOptionsBtn" title="Open WebInsight settings page">Settings</button>
        </footer>
    </div>

    <script src="../js/panel.js"></script>
</body>
</html>
